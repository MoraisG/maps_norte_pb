name: Deploy Frontend (GitHub Pages)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "backend/**"
      - "tests/**"
      - "spec/**"
      - "scripts/**"
  workflow_dispatch:

# Privilégio mínimo: ler o código e publicar no Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy já em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Publica só o frontend (antes o modo legacy publicava o repositório inteiro,
      # incluindo backend/, tests/ e scripts/)
      - name: Montar site
        run: |
          mkdir -p _site
          cp -r index.html manifest.json sw.js CNAME *.geojson assets css js vendor _site/
          ls -R _site | head -50

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
